<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dein Seelenspiegel</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #faf8f5; color: #2c2c2c; display: flex; justify-content: center; padding: 20px; margin: 0; min-height: 100vh; box-sizing: border-box; }
    .card { background: #ffffff; padding: 32px 24px; border-radius: 16px; max-width: 480px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.06); text-align: center; margin: auto; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #111; font-weight: 600; }
    p { font-size: 0.95rem; line-height: 1.5; color: #555; margin-bottom: 24px; }
    .btn { background: #2c3e50; color: #ffffff; border: none; padding: 16px 24px; font-size: 1rem; font-weight: 600; border-radius: 10px; cursor: pointer; width: 100%; transition: background 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn:active { background: #1a252f; transform: scale(0.98); }
    .chat-links { margin-top: 28px; border-top: 1px solid #eee; padding-top: 20px; text-align: left; }
    .chat-links h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 12px; }
    .chat-links a { display: block; padding: 10px 0; color: #2980b9; text-decoration: none; font-weight: 500; border-bottom: 1px solid #f5f5f5; }
    .chat-links a:last-child { border-bottom: none; }
    .toast { visibility: hidden; min-width: 200px; background-color: #27ae60; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 1; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 0.9rem; }
    .toast.show { visibility: visible; animation: fadein 0.3s, fadeout 0.5s 2.5s; }
    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
  </style>
</head>
<body>

  <div class="card">
    <h1>Dein Seelenspiegel</h1>
    <p>Kopiere den vorbereiteten Prompt mit einem Klick und füge ihn anschließend in dein gewähltes KI-Programm ein.</p>
    
    <button class="btn" onclick="copyPrompt()">📋 Prompt jetzt kopieren</button>

    <div class="chat-links">
      <h2>Direkt zum KI-Chat:</h2>
      <a href="https://chatgpt.com" target="_blank" rel="noopener">➔ ChatGPT öffnen</a>
      <a href="https://claude.ai" target="_blank" rel="noopener">➔ Claude AI öffnen</a>
      <a href="https://gemini.google.com" target="_blank" rel="noopener">➔ Google Gemini öffnen</a>
    </div>
  </div>

  <div id="toast" class="toast">Text erfolgreich kopiert!</div>

  <script>
    const promptText = `Du bist ein tiefgründiger, empathischer und psychologisch geschulter Begleiter für den "Seelenspiegel". Deine Aufgabe ist es, den Nutzer durch eine strukturierte Selbstreflexion zu führen.

Begrüße den Nutzer warm und einladend mit folgenden Worten:
"Herzlich willkommen zu deinem persönlichen Seelenspiegel. Schön, dass du dir diese Zeit für dich nimmst. 

Bitte beantworte die folgenden 15 Fragen ganz in deinem eigenen Tempo. Du kannst mir deine Antworten nummeriert von 1 bis 15 in einer einzigen Nachricht schicken oder sie mir nach und nach senden – ganz so, wie es sich für dich richtig anfühlt."

Warte anschließend auf die Eingaben des Nutzers. Sobald der Nutzer seine Antworten gesendet hat, erstelle eine tiefgründige, wertschätzende und spiegelnde Synthese (den "Seelenspiegel"), die dem Nutzer neue Einblicke in seine Innenwelt schenkt. Bleibe dabei stets wertfrei, warmherzig und klar.`;

    function copyPrompt() {
      navigator.clipboard.writeText(promptText).then(() => {
        const toast = document.getElementById("toast");
        toast.className = "toast show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
      });
    }
  </script>

</body>
</html>
