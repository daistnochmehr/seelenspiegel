<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seelenspiegel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn {
            display: inline-block;
            background-color: #10a37f;
            color: white;
            padding: 16px 28px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn:hover {
            background-color: #0e8c6d;
        }
        .status {
            margin-top: 20px;
            font-size: 15px;
            color: #0d6833;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Dein Seelenspiegel</h2>
        <p style="margin-bottom: 25px; color: #666;">Klicke auf den Button, um den Prompt zu kopieren und ChatGPT zu starten.</p>
        
        <!-- Der Button -->
        <button class="btn" onclick="copyAndOpen()">Prompt in Zwischenablage kopieren</button>
        
        <!-- Erfolgsanzeige -->
        <div id="statusMsg" class="status">Kopiert! ChatGPT öffnet sich...</div>
    </div>

    <script>
        function copyAndOpen() {
            // HIER DEINEN KOMPLETTEN PROMPT EINFÜGEN (zwischen die Anführungszeichen ``):
            const secretPrompt = `Hier kommt dein kompletter Seelenspiegel-Prompt rein. Er steht niemals im Link und ist auf der Website unsichtbar!`;

            // Kopiert den Text unsichtbar in den Hintergrund-Speicher des Handys
            navigator.clipboard.writeText(secretPrompt).then(() => {
                document.getElementById('statusMsg').style.display = 'block';
                
                // Öffnet die saubere ChatGPT-Startseite nach kurzer Verzögerung
                setTimeout(function() {
                    window.location.href = 'https://chatgpt.com';
                }, 800);
            }).catch(err => {
                alert('Bitte tippe einmal kurz auf den Bildschirm und versuche es noch einmal.');
            });
        }
    </script>

</body>
</html>
