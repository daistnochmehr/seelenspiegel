<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seelenspiegel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn {
            display: inline-block;
            background-color: #10a37f;
            color: white;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #0e8c6d;
        }
        textarea {
            width: 100%;
            height: 120px;
            margin-top: 15px;
            padding: 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fafafa;
            display: none;
        }
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #0d6833;
            display: none;
            text-align: left;
            background: #e6f4ea;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Dein Seelenspiegel</h2>
        <p>Klicke auf den Button, um den Prompt für ChatGPT bereitzustellen.</p>
        
        <!-- Der Button -->
        <button class="btn" onclick="showPrompt()">Prompt in Zwischenablage kopieren</button>
        
        <!-- Das Textfeld (bleibt unsichtbar, bis man klickt) -->
        <textarea id="myPromptBox" readonly></textarea>

        <!-- Anweisung nach dem Klick -->
        <div id="instructionBox" class="instructions">
            <strong>Fast geschafft!</strong><br>
            1. Markiere den Text oben oder tippe auf "Kopieren".<br>
            2. Öffne ChatGPT und füge ihn dort ein.
            <br><br>
            <a href="https://chatgpt.com" target="_blank" class="btn" style="text-align:center; display:block; text-decoration:none;">ChatGPT jetzt öffnen</a>
        </div>
    </div>

    <script>
        function showPrompt() {
            // HIER DEINEN KOMPLETTEN PROMPT EINFÜGEN:
            const secretPrompt = `Hier kommt dein kompletter Seelenspiegel-Prompt rein. Er steht niemals im Link!`;

            const box = document.getElementById('myPromptBox');
            box.value = secretPrompt;
            box.style.display = 'block';
            box.select();
            
            document.getElementById('instructionBox').style.display = 'block';

            // Versuche zusätzlich, ihn in die Zwischenablage zu drücken
            try {
                navigator.clipboard.writeText(secretPrompt);
            } catch (e) {
                // Ignorieren, falls Handy es blockiert, da das Textfeld da ist
            }
        }
    </script>

</body>
</html>
