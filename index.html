<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dein Seelenspiegel – KI-Begleitung</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fa;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        p {
            color: #666666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn-primary {
            background-color: #1e293b;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 30px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .btn-primary:hover {
            background-color: #0f172a;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .toast {
            margin-top: 15px;
            font-size: 14px;
            color: #10b981;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-weight: 500;
        }
        .divider {
            border-top: 1px solid #eaeaea;
            margin: 25px 0;
        }
        .links-section {
            text-align: left;
        }
        .links-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888888;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .ai-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .ai-links a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ai-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Dein Seelenspiegel</h1>
        <p>Kopiere den Startbefehl mit einem Klick und füge ihn in dein gewähltes KI-Programm ein.</p>
        
        <button class="btn-primary" onclick="copyPrompt()">📋 Prompt jetzt kopieren</button>
        <div id="toast" class="toast">In die Zwischenablage kopiert! ✨</div>

        <div class="divider"></div>

        <div class="links-section">
            <div class="links-title">Direkt zum KI-Chat:</div>
            <div class="ai-links">
                <a href="https://chatgpt.com" target="_blank">→ ChatGPT öffnen</a>
                <a href="https://claude.ai" target="_blank">→ Claude AI öffnen</a>
                <a href="https://gemini.google.com" target="_blank">→ Google Gemini öffnen</a>
                <a href="https://copilot.microsoft.com" target="_blank">→ Copilot öffnen</a>
            </div>
        </div>
    </div>

    <script>
        function copyPrompt() {
            // Hier ist nun absolut sauber nur der Einstieg ohne jegliche Fragenliste hinterlegt.
            const cleanText = `Starte bitte meinen persönlichen Seelenspiegel. 

Begrüße mich zuerst herzlich mit genau diesen Worten:
„Herzlich willkommen zu deinem persönlichen Seelenspiegel. Schön, dass du dir diese Zeit für dich nimmst.“

Deine Aufgabe ist es, mich durch insgesamt 15 tiefgründige persönliche Fragen zu führen, und zwar streng nacheinander. Stelle mir jetzt bitte DIREKT ALS ERSTES NUR DIE ERSTE FRAGE:
„Welcher Satz beschreibt am besten, wie du dich selbst siehst?“

Warte danach unbedingt auf meine Antwort. Zeige mir keine weiteren Fragen im Voraus. Sobald ich antworte, stellst du mir die nächste Frage. Bist du bereit?`;

            navigator.clipboard.writeText(cleanText).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.opacity = '0';
                    const btn = document.querySelector('.btn-primary');
                    btn.innerHTML = '✓ Erfolgreich kopiert!';
                    setTimeout(() => {
                        btn.innerHTML = '📋 Prompt jetzt kopieren';
                    }, 2000);
                }, 2500);
            }).catch(err => {
                console.error('Fehler beim Kopieren: ', err);
            });
        }
    </script>

</body>
</html>
