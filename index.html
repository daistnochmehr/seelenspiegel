<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dein Seelenspiegel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #10a37f;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #555;
        }
        .btn {
            display: inline-block;
            background-color: #10a37f;
            color: white;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 25px;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            width: 100%;
        }
        .btn:hover {
            background-color: #0e8c6d;
        }
        .success-box {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background: #e6f4ea;
            border: 1px solid #10a37f;
            border-radius: 6px;
            font-size: 15px;
            color: #0d6833;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dein Seelenspiegel</h1>
        <p>Klicke auf den Button, um den Prozess zu starten.</p>
        
        <!-- Der Button exakt nach der Anleitung im Buch -->
        <button class="btn" onclick="copyPrompt()">Prompt in Zwischenablage kopieren</button>
        
        <!-- Die Bestätigung und der nächste Schritt wie im Buch beschrieben -->
        <div id="successBox" class="success-box">
            <strong>Erfolgreich kopiert!</strong><br>
            Öffne nun ChatGPT und füge den Prompt dort ein.<br><br>
            <a href="https://chatgpt.com" target="_blank" class="btn" style="text-align:center; display:block;">ChatGPT öffnen</a>
        </div>
    </div>

    <script>
        function copyPrompt() {
            // HIER DEINEN VOLLSTÄNDIGEN SEELENSPIEGEL-PROMPT EINFÜGEN:
            const secretPrompt = `Hier kommt dein kompletter Seelenspiegel-Prompt rein. Er ist absolut unsichtbar im Code versteckt und taucht in keinem Link auf!`;

            // Kopiert den Text unsichtbar in die Zwischenablage des Geräts
            navigator.clipboard.writeText(secretPrompt).then(() => {
                document.getElementById('successBox').style.display = 'block';
            }).catch(err => {
                alert('Bitte tippe kurz auf den Bildschirm und versuche es noch einmal.');
            });
        }
    </script>

</body>
</html>
