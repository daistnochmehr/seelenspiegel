<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seelenspiegel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn {
            display: inline-block;
            background-color: #10a37f;
            color: white;
            padding: 16px 28px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #0e8c6d;
        }
        .success-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #e6f4ea;
            border: 1px solid #10a37f;
            border-radius: 8px;
            color: #0d6833;
            font-size: 15px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Dein Seelenspiegel</h2>
        <p style="margin-bottom: 25px; color: #666;">Klicke auf den Button, um den Prompt sicher in deinen Zwischenspeicher zu laden.</p>
        
        <!-- Der Button -->
        <button class="btn" onclick="copyOnly()">Prompt in Zwischenablage kopieren</button>
        
        <!-- Die manuelle Freigabe, die nach dem Klick erscheint -->
        <div id="successBox" class="success-box">
            <strong>Erfolgreich kopiert!</strong><br>
            Öffne nun ChatGPT und füge den Text mit <strong>Strg + V</strong> (oder langem Tippen) ein.<br><br>
            <a href="https://chatgpt.com" class="btn" style="text-align:center; display:block;">Manuell zu ChatGPT wechseln</a>
        </div>
    </div>

    <script>
        function copyOnly() {
            // HIER DEINEN KOMPLETTEN PROMPT EINFÜGEN:
            const secretPrompt = `Hier kommt dein kompletter Seelenspiegel-Prompt rein. Er steht niemals im Link und wird nicht automatisch geöffnet!`;

            // Kopiert den Text nur in den Speicher – KEINE automatische Weiterleitung mehr!
            navigator.clipboard.writeText(secretPrompt).then(() => {
                document.getElementById('successBox').style.display = 'block';
            }).catch(err => {
                alert('Bitte tippe auf den Text oder versuche es noch einmal.');
            });
        }
    </script>

</body>
</html>
