<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dein Seelenspiegel – KI-Begleitung</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fa;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        p {
            color: #666666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn-primary {
            background-color: #1e293b;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 30px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .btn-primary:hover {
            background-color: #0f172a;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .toast {
            margin-top: 15px;
            font-size: 14px;
            color: #10b981;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-weight: 500;
        }
        .divider {
            border-top: 1px solid #eaeaea;
            margin: 25px 0;
        }
        .links-section {
            text-align: left;
        }
        .links-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888888;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .ai-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .ai-links a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ai-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Dein Seelenspiegel</h1>
        <p>Kopiere den Startbefehl mit einem Klick und füge ihn in dein gewähltes KI-Programm ein.</p>
        
        <button class="btn-primary" onclick="copyPrompt()">📋 Prompt jetzt kopieren</button>
        <div id="toast" class="toast">In die Zwischenablage kopiert! ✨</div>

        <div class="divider"></div>

        <div class="links-section">
            <div class="links-title">Direkt zum KI-Chat:</div>
            <div class="ai-links">
                <a href="https://chatgpt.com" target="_blank">→ ChatGPT öffnen</a>
                <a href="https://claude.ai" target="_blank">→ Claude AI öffnen</a>
                <a href="https://gemini.google.com" target="_blank">→ Google Gemini öffnen</a>
            </div>
        </div>
    </div>

    <script>
        function copyPrompt() {
            // Die 15 Fragen sauber definiert
            const questions = [
                "Welcher Satz beschreibt am besten, wie du dich selbst siehst?",
                "Was kommt dir in den Sinn, wenn du an das denkst, was du gut kannst und was dich ausmacht?",
                "Woran merkst du, was dir guttut und was dir wichtig ist?",
                "Was ist dir für dein Leben wichtig, wenn du an deine Wünsche und Vorstellungen denkst?",
                "Was möchtest du, dass andere Menschen von dir sehen oder verstehen?",
                "Was bedeuten Liebe und Zugehörigkeit für dich im Zusammenhang mit anderen Menschen?",
                "Wie erlebst du Nähe und Abstand zu anderen Menschen?",
                "Was bedeutet Vertrauen für dich im Umgang mit einem anderen Menschen?",
                "Wenn du an deine Kindheit zurückdenkst: Gibt es Erfahrungen oder Erwartungen, die für dich heute noch eine Rolle spielen? Wenn ja, welche?",
                "Wenn es in deinem Leben eine verletzende Erfahrung gab: Was hat sie verändert – und was vielleicht auch nicht?",
                "Falls du Schutzmauern in deinem Leben kennst: Wovor möchtest du dich damit schützen – und was geben sie dir?",
                "Gibt es Gefühle oder Situationen, die etwas in deinem Verhalten verändern? Wenn ja, welche – und was bleibt dabei trotzdem gleich?",
                "Welche Bedeutung haben persönliche Grenzen für dich, und wie gehst du damit um, wenn sie im Kontakt mit anderen eine Rolle spielen?",
                "Wie erlebst du es, wenn du anderen Menschen mehr von dir zeigst?",
                "Woran machst du deinen eigenen Wert fest, und wie erlebst du ihn in unterschiedlichen Situationen?"
            ];

            const cleanText = `Starte bitte meinen persönlichen Seelenspiegel und begrüße mich herzlich mit: „Herzlich willkommen zu deinem persönlichen Seelenspiegel. Schön, dass du dir diese Zeit für dich nimmst.“ Führe mich danach Schritt für Schritt durch die folgenden 15 Fragen:\n\n` + questions.map((q, i) => `${i + 1}. ${q}`).join('\n');

            navigator.clipboard.writeText(cleanText).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.opacity = '0';
                    const btn = document.querySelector('.btn-primary');
                    btn.innerHTML = '✓ Erfolgreich kopiert!';
                    setTimeout(() => {
                        btn.innerHTML = '📋 Prompt jetzt kopieren';
                    }, 2000);
                }, 2500);
            }).catch(err => {
                console.error('Fehler beim Kopieren: ', err);
            });
        }
    </script>

</body>
</html>
